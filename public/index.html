<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Startup Tech Co.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0B2335 0%, #1a3a5c 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 3em;
      max-width: 480px;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    h1 {
      font-size: 1.8em;
      margin-bottom: 0.3em;
    }
    p.subtitle {
      color: #9fb3c8;
      margin-bottom: 2em;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5em;
      background: rgba(46, 204, 113, 0.15);
      border: 1px solid rgba(46, 204, 113, 0.4);
      color: #2ecc71;
      padding: 0.5em 1.2em;
      border-radius: 999px;
      font-size: 0.9em;
      margin-bottom: 2em;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #2ecc71;
      border-radius: 50%;
    }
    .info {
      text-align: left;
      font-size: 0.9em;
      color: #cdd9e5;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      padding: 1em 1.2em;
    }
    .info div {
      display: flex;
      justify-content: space-between;
      padding: 0.4em 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .info div:last-child { border-bottom: none; }
    .info span:first-child { color: #7f93a8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Startup Tech Co.</h1>
    <p class="subtitle">Sample Web Application</p>
    <div class="status"><span class="dot"></span> System Operational</div>
    <div class="info" id="info">Loading server info...</div>
  </div>

  <script>
    fetch('/api/info')
      .then(res => res.json())
      .then(data => {
        document.getElementById('info').innerHTML = `
          <div><span>Version</span><span>${data.version}</span></div>
          <div><span>Environment</span><span>${data.environment}</span></div>
          <div><span>Hostname</span><span>${data.hostname}</span></div>
        `;
      })
      .catch(() => {
        document.getElementById('info').innerHTML = '<div>Could not load server info</div>';
      });
  </script>
</body>
</html>
